.sk-root {
  --sk-titlebar-h: 40px;
  --sk-toolbar-h: 46px;
  --sk-tabbar-h: 38px;
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100%;
  min-height: 0;
  font-family: var(--sk-fontSans);
  font-size: 13px;
  color: var(--sk-text);
  background: var(--sk-bg);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
.sk-root *, .sk-root *::before, .sk-root *::after { box-sizing: border-box; }
.sk-root button { font-family: inherit; cursor: pointer; }

/* \u2014 Barre de titre \u2014 */
.sk-titlebar {
  display: flex;
  align-items: center;
  gap: 10px;
  height: var(--sk-titlebar-h);
  padding: 0 12px;
  background: var(--sk-titlebar);
  color: var(--sk-titlebarText);
  border-bottom: 1px solid var(--sk-border);
  user-select: none;
}
.sk-winctl { display: flex; gap: 8px; align-items: center; }
.sk-dot { width: 12px; height: 12px; border-radius: 50%; border: none; }
.sk-dot.close { background: #ff5f57; }
.sk-dot.min { background: #febc2e; }
.sk-dot.max { background: #28c840; }
.sk-root[data-sk-window="ubuntu"] .sk-winctl { order: 3; margin-left: auto; }
.sk-root[data-sk-window="ubuntu"] .sk-dot {
  width: 18px; height: 18px; border-radius: 50%;
  background: rgba(255,255,255,0.12); color: var(--sk-titlebarText);
  font-size: 11px; line-height: 18px; text-align: center;
}
.sk-root[data-sk-window="generic"] .sk-winctl { order: 3; margin-left: auto; }
.sk-root[data-sk-window="generic"] .sk-dot {
  width: 16px; height: 16px; border-radius: 4px; background: var(--sk-surface2);
  color: var(--sk-textMuted); font-size: 11px; line-height: 16px; text-align: center;
}
.sk-title-logo { font-weight: 700; letter-spacing: 0.5px; }
.sk-title-name {
  font-weight: 500; opacity: 0.85; max-width: 40ch; overflow: hidden;
  text-overflow: ellipsis; white-space: nowrap;
}
.sk-title-name:hover { opacity: 1; }
.sk-titlebar .sk-spacer { flex: 1; }
.sk-theme-select {
  height: 26px; padding: 0 8px; border-radius: var(--sk-radius);
  background: var(--sk-surface2); color: var(--sk-text);
  border: 1px solid var(--sk-border); font-size: 12px;
}

/* \u2014 Barre d'outils \u2014 */
.sk-toolbar {
  display: flex; align-items: center; justify-content: space-between; gap: 6px;
  height: var(--sk-toolbar-h); padding: 0 10px;
  background: var(--sk-surface); border-bottom: 1px solid var(--sk-border);
  overflow: visible;
}
.sk-toolbar-zone { display: flex; align-items: center; gap: 4px; }
.sk-tool {
  display: inline-flex; align-items: center; gap: 6px; height: 30px;
  padding: 0 10px; border-radius: var(--sk-radius);
  background: var(--sk-surface2); color: var(--sk-text);
  border: 1px solid var(--sk-border); font-size: 12px; white-space: nowrap;
  transition: background 0.12s, border-color 0.12s, transform 0.05s;
  cursor: pointer;
}
.sk-tool:hover { border-color: var(--sk-borderStrong); background: var(--sk-surface); }
.sk-tool:active { transform: translateY(1px); }
.sk-tool:disabled { opacity: 0.4; cursor: default; }
.sk-tool.primary { background: var(--sk-accent); color: var(--sk-accentText); border-color: transparent; }
.sk-tool.active { background: var(--sk-accent); color: var(--sk-accentText); border-color: transparent; }
.sk-tool.danger { color: var(--sk-danger); }
.sk-tool .glyph { font-size: 15px; line-height: 1; }
.sk-tool-sep { width: 1px; height: 20px; background: var(--sk-border); margin: 0 4px; flex: none; }
/* Boutons ic\xF4ne-seule (32\xD730 carr\xE9). */
.sk-tool-icon { width: 34px; padding: 0; justify-content: center; }
.sk-tool-icon .glyph { font-size: 16px; }
/* S\xE9lecteur de type de relation compact. */
.sk-tool-select {
  height: 30px; padding: 0 24px 0 10px; border-radius: var(--sk-radius);
  background: var(--sk-surface2); color: var(--sk-text);
  border: 1px solid var(--sk-border); font-size: 12px; max-width: 180px;
  cursor: pointer;
}
.sk-tool-select:hover { border-color: var(--sk-borderStrong); }

/* \u2014 Onglets diagrammes \u2014 */
.sk-tabbar {
  display: flex; align-items: stretch; gap: 2px; height: var(--sk-tabbar-h);
  padding: 0 8px; background: var(--sk-surface2);
  border-bottom: 1px solid var(--sk-border); overflow-x: auto; scrollbar-width: thin;
}
.sk-tab {
  display: inline-flex; align-items: center; gap: 8px; padding: 0 10px;
  align-self: center; height: 28px; border-radius: var(--sk-radius);
  background: transparent; color: var(--sk-textMuted);
  border: 1px solid transparent; font-size: 12px; white-space: nowrap; cursor: pointer;
}
.sk-tab:hover { background: var(--sk-surface); color: var(--sk-text); }
.sk-tab.active {
  background: var(--sk-surface); color: var(--sk-text);
  border-color: var(--sk-border); font-weight: 600;
}
.sk-tab .schema-glyph { opacity: 0.7; }
.sk-tab .tab-close, .sk-tab .tab-split {
  width: 16px; height: 16px; border-radius: 4px; border: none; background: transparent;
  color: inherit; opacity: 0.55; font-size: 12px; line-height: 16px; text-align: center;
}
.sk-tab .tab-close:hover { opacity: 1; background: var(--sk-danger); color: #fff; }
.sk-tab .tab-split:hover { opacity: 1; background: var(--sk-accent); color: var(--sk-accentText); }
.sk-tab-name-input {
  background: var(--sk-bg); color: var(--sk-text); border: 1px solid var(--sk-accent);
  border-radius: 4px; font-size: 12px; padding: 1px 4px; width: 12ch; outline: none;
}
.sk-tab-add {
  align-self: center; width: 26px; height: 26px; border-radius: var(--sk-radius);
  background: transparent; border: 1px dashed var(--sk-border); color: var(--sk-textMuted);
  font-size: 16px; line-height: 1;
}
.sk-tab-add:hover { border-color: var(--sk-accent); color: var(--sk-accent); }

/* \u2014 Zone de travail \u2014 */
.sk-workarea { flex: 1; display: flex; min-height: 0; min-width: 0; }
.sk-panel {
  background: var(--sk-surface); display: flex; flex-direction: column; min-height: 0;
}
.sk-palette { width: 208px; border-right: 1px solid var(--sk-border); flex: none; }
.sk-inspector { width: 316px; border-left: 1px solid var(--sk-border); flex: none; }
.sk-center { flex: 1; display: flex; flex-direction: column; min-width: 0; min-height: 0; }

.sk-panel-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 9px 12px; font-size: 11px; font-weight: 700; letter-spacing: 0.6px;
  text-transform: uppercase; color: var(--sk-textMuted);
  border-bottom: 1px solid var(--sk-border);
}
.sk-panel-body { flex: 1; overflow-y: auto; scrollbar-width: thin; }

/* \u2014 Palette \u2014 */
.sk-palette-group { padding: 8px 8px 4px; }
.sk-palette-group-title {
  font-size: 10px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
  color: var(--sk-textMuted); padding: 4px 6px;
}
.sk-chip {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; margin: 3px 0;
  border-radius: var(--sk-radius); background: var(--sk-surface2);
  border: 1px solid var(--sk-border); cursor: grab; user-select: none;
  transition: border-color 0.12s, transform 0.05s;
}
.sk-chip:hover { border-color: var(--sk-borderStrong); }
.sk-chip:active { cursor: grabbing; transform: scale(0.98); }
.sk-chip-glyph {
  width: 26px; height: 26px; flex: none; border-radius: 6px; color: #fff;
  display: grid; place-items: center; font-weight: 700; font-size: 13px;
}
.sk-chip-label { font-size: 12.5px; }
.sk-edge-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 10px; font-size: 12px;
  color: var(--sk-textMuted);
}
.sk-edge-glyph { font-family: var(--sk-fontMono); color: var(--sk-text); }

/* \u2014 Canvas / split \u2014 */
.sk-canvas-area { flex: 1; display: flex; min-height: 0; min-width: 0; }
.sk-pane { position: relative; flex: 1; min-width: 0; display: flex; flex-direction: column; }
.sk-pane + .sk-pane { border-left: 2px solid var(--sk-border); }
.sk-pane-head {
  display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 10px;
  font-size: 11.5px; color: var(--sk-textMuted); background: var(--sk-surface2);
  border-bottom: 1px solid var(--sk-border);
}
.sk-pane-head .pane-swap {
  margin-left: auto; height: 20px; padding: 0 8px; border-radius: 5px;
  border: 1px solid var(--sk-border); background: var(--sk-surface); color: var(--sk-text);
  font-size: 11px;
}
.sk-pane-head .pane-swap:hover { border-color: var(--sk-accent); color: var(--sk-accent); }
.sk-canvas { flex: 1; min-height: 0; display: block; touch-action: none; background: var(--sk-canvasBg); }
.sk-canvas.connecting { cursor: crosshair; }
.sk-node-title { font-weight: 700; }
.sk-node-stereo { font-style: italic; opacity: 0.8; }
.sk-node-member { font-family: var(--sk-fontMono); font-size: 11.5px; }
.sk-node-static { text-decoration: underline; }
.sk-handle { fill: var(--sk-accent); stroke: var(--sk-surface); stroke-width: 1.5; cursor: nwse-resize; }
.sk-port { fill: var(--sk-accent); opacity: 0; cursor: crosshair; transition: opacity 0.1s; }
.sk-node-hover .sk-port { opacity: 0.9; }
.sk-marquee {
  fill: var(--sk-selection); fill-opacity: 0.14;
  stroke: var(--sk-selection); stroke-width: 1.5; stroke-dasharray: 5 3;
  pointer-events: none;
}

.sk-canvas-hint {
  position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
  text-align: center; color: var(--sk-textMuted); pointer-events: none; font-size: 13px;
  line-height: 1.6;
}

/* \u2014 Inspecteur \u2014 */
.sk-insp-tabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--sk-border); }
.sk-insp-tab {
  padding: 6px 10px; font-size: 12px; border: none; background: transparent;
  color: var(--sk-textMuted); border-bottom: 2px solid transparent; border-radius: 5px 5px 0 0;
}
.sk-insp-tab:hover { color: var(--sk-text); }
.sk-insp-tab.active { color: var(--sk-text); border-bottom-color: var(--sk-accent); font-weight: 600; }
.sk-insp-body { flex: 1; overflow-y: auto; scrollbar-width: thin; padding: 12px; }
.sk-field { margin-bottom: 12px; }
.sk-field label {
  display: block; font-size: 11px; font-weight: 600; color: var(--sk-textMuted);
  margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.4px;
}
.sk-input, .sk-select, .sk-textarea {
  width: 100%; padding: 7px 9px; border-radius: var(--sk-radius);
  background: var(--sk-bg); color: var(--sk-text); border: 1px solid var(--sk-border);
  font-size: 12.5px; font-family: inherit; outline: none;
}
.sk-input:focus, .sk-select:focus, .sk-textarea:focus {
  border-color: var(--sk-accent); box-shadow: 0 0 0 3px var(--sk-focusRing);
}
.sk-textarea { font-family: var(--sk-fontMono); resize: vertical; min-height: 90px; line-height: 1.5; }
.sk-row { display: flex; gap: 8px; }
.sk-row > * { flex: 1; }
.sk-color-input { width: 100%; height: 34px; padding: 3px; border-radius: var(--sk-radius);
  background: var(--sk-bg); border: 1px solid var(--sk-border); }

.sk-members { margin-top: 4px; }
.sk-member {
  display: grid; grid-template-columns: 20px 1fr 0.82fr 20px 20px; gap: 4px; align-items: center;
  padding: 4px 0;
}
.sk-member select, .sk-member input { padding: 5px 6px; font-size: 12px; }
.sk-flag {
  height: 26px; border-radius: 5px; border: 1px solid var(--sk-border);
  background: var(--sk-surface2); color: var(--sk-textMuted); font-size: 11px; font-weight: 700;
}
.sk-flag.on { background: var(--sk-accent); color: var(--sk-accentText); border-color: transparent; }
.sk-vis {
  width: 100%; text-align: center; font-family: var(--sk-fontMono); font-weight: 700;
  padding: 5px 0; border-radius: 5px; border: 1px solid var(--sk-border);
  background: var(--sk-surface2); color: var(--sk-text);
}
.sk-mini-btn {
  border: 1px solid var(--sk-border); background: var(--sk-surface2); color: var(--sk-text);
  border-radius: 5px; height: 26px; font-size: 13px; line-height: 1;
}
.sk-mini-btn:hover { border-color: var(--sk-borderStrong); }
.sk-mini-btn.danger:hover { background: var(--sk-danger); color: #fff; border-color: transparent; }
.sk-add-member {
  width: 100%; margin-top: 6px; height: 30px; border-radius: var(--sk-radius);
  border: 1px dashed var(--sk-border); background: transparent; color: var(--sk-textMuted); font-size: 12px;
}
.sk-add-member:hover { border-color: var(--sk-accent); color: var(--sk-accent); }
.sk-subhead {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px;
  color: var(--sk-textMuted); margin: 14px 0 6px;
}
.sk-empty { color: var(--sk-textMuted); font-size: 12.5px; text-align: center; padding: 30px 12px; line-height: 1.6; }
.sk-code {
  margin: 0; padding: 12px; border-radius: var(--sk-radius); background: var(--sk-codeBg);
  color: var(--sk-codeText); font-family: var(--sk-fontMono); font-size: 12px; line-height: 1.55;
  white-space: pre; overflow: auto; scrollbar-width: thin;
}
.sk-copy-bar { display: flex; gap: 6px; margin-bottom: 8px; }

/* \u2014 Console \u2014 */
.sk-console {
  display: flex; flex-direction: column; background: var(--sk-consoleBg);
  border-top: 1px solid var(--sk-border); flex: none;
}
.sk-console.collapsed { height: 34px !important; }
.sk-console-resize { height: 4px; cursor: ns-resize; background: transparent; }
.sk-console-resize:hover { background: var(--sk-accent); }
.sk-console-bar {
  display: flex; align-items: center; gap: 4px; height: 30px; padding: 0 8px;
  border-bottom: 1px solid var(--sk-border); user-select: none;
}
.sk-console.collapsed .sk-console-bar { border-bottom: none; }
.sk-console-tab {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 9px;
  border-radius: 5px; border: none; background: transparent; color: var(--sk-textMuted); font-size: 12px;
}
.sk-console-tab:hover { color: var(--sk-text); background: var(--sk-surface2); }
.sk-console-tab.active { color: var(--sk-text); background: var(--sk-surface2); font-weight: 600; }
.sk-badge {
  min-width: 16px; height: 16px; padding: 0 4px; border-radius: 8px; font-size: 10px;
  font-weight: 700; line-height: 16px; text-align: center; color: #fff;
}
.sk-badge.err { background: var(--sk-logError); }
.sk-badge.warn { background: var(--sk-logWarn); }
.sk-badge.neutral { background: var(--sk-textMuted); }
.sk-console-spacer { flex: 1; }
.sk-console-body { flex: 1; overflow-y: auto; scrollbar-width: thin; font-family: var(--sk-fontMono); font-size: 12px; }
.sk-log {
  display: flex; align-items: baseline; gap: 8px; padding: 3px 12px;
  border-bottom: 1px solid color-mix(in srgb, var(--sk-border) 45%, transparent);
  line-height: 1.5;
}
.sk-log:hover { background: var(--sk-surface2); }
.sk-log-time { color: var(--sk-textMuted); font-size: 11px; flex: none; }
.sk-log-src {
  color: var(--sk-textMuted); font-size: 10.5px; flex: none; padding: 0 5px; border-radius: 4px;
  background: var(--sk-surface2);
}
.sk-log-icon { flex: none; width: 14px; text-align: center; }
.sk-log-msg { flex: 1; white-space: pre-wrap; word-break: break-word; }
.sk-log.log .sk-log-msg { color: var(--sk-text); }
.sk-log.debug .sk-log-msg, .sk-log.debug .sk-log-icon { color: var(--sk-logDebug); }
.sk-log.info .sk-log-msg, .sk-log.info .sk-log-icon { color: var(--sk-logInfo); }
.sk-log.warn .sk-log-msg, .sk-log.warn .sk-log-icon { color: var(--sk-logWarn); }
.sk-log.error .sk-log-msg, .sk-log.error .sk-log-icon { color: var(--sk-logError); }
.sk-log.success .sk-log-msg, .sk-log.success .sk-log-icon { color: var(--sk-logSuccess); }
.sk-log.action .sk-log-msg, .sk-log.action .sk-log-icon { color: var(--sk-accent); }
.sk-log-detail { margin: 2px 0 4px 34px; color: var(--sk-textMuted); white-space: pre-wrap; }

/* \u2014 Menu contextuel \u2014 */
.sk-ctx {
  position: fixed; z-index: 9999; min-width: 200px; padding: 5px; border-radius: var(--sk-radius);
  background: var(--sk-surface); border: 1px solid var(--sk-borderStrong); box-shadow: var(--sk-shadow);
  color: var(--sk-text); font-size: 12.5px;
}
.sk-ctx-header {
  padding: 5px 10px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.3px;
  text-transform: uppercase; color: var(--sk-textMuted); border-bottom: 1px solid var(--sk-border); margin-bottom: 4px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 240px;
}
.sk-ctx-item {
  position: relative; display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px; border: none;
  background: transparent; color: var(--sk-text); font-size: 12.5px; border-radius: 6px; text-align: left;
}
.sk-ctx-item:hover { background: var(--sk-accent); color: var(--sk-accentText); }
.sk-ctx-item.danger { color: var(--sk-danger); }
.sk-ctx-item.danger:hover { background: var(--sk-danger); color: #fff; }
.sk-ctx-item.disabled { opacity: 0.4; pointer-events: none; }
.sk-ctx-sep { height: 1px; background: var(--sk-border); margin: 4px 2px; }
.sk-ctx-item .kbd { margin-left: auto; opacity: 0.6; font-size: 11px; font-family: var(--sk-fontMono); }
.sk-ctx-arrow { margin-left: auto; opacity: 0.7; font-size: 15px; }
.sk-ctx-item.has-sub .sk-ctx-sub {
  position: absolute; left: 100%; top: -5px; margin-left: 2px; display: none;
}
.sk-ctx-item.has-sub:hover .sk-ctx-sub { display: block; }
.sk-ctx-sub .sk-ctx-item { color: var(--sk-text); }

/* \u2014 Toast \u2014 */
.sk-toast-wrap { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); z-index: 9998;
  display: flex; flex-direction: column; gap: 6px; align-items: center; pointer-events: none; }
.sk-toast {
  padding: 8px 14px; border-radius: var(--sk-radius); background: var(--sk-surface);
  border: 1px solid var(--sk-border); box-shadow: var(--sk-shadow); font-size: 12.5px;
  color: var(--sk-text); animation: sk-toast-in 0.18s ease;
}
.sk-toast.error { border-color: var(--sk-danger); }
.sk-toast.success { border-color: var(--sk-logSuccess); }
@keyframes sk-toast-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

@media (prefers-reduced-motion: reduce) {
  .sk-root *, .sk-toast { animation: none !important; transition: none !important; }
}

/* \u2014 S\xE9parateurs redimensionnables \u2014 */
.sk-splitter {
  flex: 0 0 6px; align-self: stretch; cursor: col-resize; background: transparent;
  position: relative; z-index: 5;
}
.sk-splitter::after {
  content: ''; position: absolute; inset: 0 2px; border-radius: 2px; background: transparent;
  transition: background 0.12s;
}
.sk-splitter:hover::after, .sk-splitter.active::after { background: var(--sk-accent); }

/* \u2014 Curseurs canvas \u2014 */
.sk-canvas.panning { cursor: grabbing; }
.sk-canvas.connecting { cursor: crosshair; }
.sk-canvas.connecting [data-node-id] { cursor: crosshair; }
/* Surbrillance des cibles connectables au survol en mode connexion. */
.sk-canvas.connecting [data-node-id]:hover > rect:first-of-type,
.sk-canvas.connecting [data-node-id]:hover > path:first-of-type {
  stroke: var(--sk-accent) !important;
  stroke-width: 2.5 !important;
}
/* Cible active pendant le drag de connexion (mise \xE0 jour par JS). */
[data-node-id].sk-connect-target > rect:first-of-type,
[data-node-id].sk-connect-target > path:first-of-type {
  stroke: var(--sk-accent) !important;
  stroke-width: 3 !important;
  filter: drop-shadow(0 0 6px var(--sk-accent));
}
/* Pendant un drag global : neutralise s\xE9lection texte et curseur natif. */
body.sk-dragging { user-select: none !important; -webkit-user-select: none !important; }
body.sk-dragging * { user-select: none !important; -webkit-user-select: none !important; cursor: inherit !important; }
body.sk-dragging .sk-canvas.connecting, body.sk-dragging .sk-canvas.connecting * { cursor: crosshair !important; }
.sk-connect-hint {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%);
  background: var(--sk-accent); color: var(--sk-accentText); font-size: 12px; font-weight: 600;
  padding: 5px 12px; border-radius: 999px; pointer-events: none; z-index: 20;
  box-shadow: var(--sk-shadow);
}

/* \u2014 Barre d'ic\xF4nes / bouton ic\xF4ne \u2014 */
.sk-icon-btn {
  width: 24px; height: 22px; border-radius: 5px; border: 1px solid transparent;
  background: transparent; color: var(--sk-textMuted); font-size: 13px; line-height: 1;
}
.sk-icon-btn:hover { background: var(--sk-surface2); color: var(--sk-text); border-color: var(--sk-border); }

/* \u2014 Palette : mode compact (ic\xF4nes seules) \u2014 */
.sk-palette-title { font-size: 11px; font-weight: 700; letter-spacing: 0.6px; text-transform: uppercase; color: var(--sk-textMuted); }
.sk-palette { transition: width 0.16s ease; }
.sk-palette.compact { width: 56px; }
/* En mode compact, l'ent\xEAte reste visible et le bouton de bascule est centr\xE9. */
.sk-palette.compact .sk-panel-head { padding: 9px 0; justify-content: center; }
.sk-palette.compact .sk-palette-title,
.sk-palette.compact .sk-spacer { display: none; }
.sk-palette.compact .sk-palette-group-title,
.sk-palette.compact .sk-chip-label,
.sk-palette.compact .sk-edge-row span:not(.sk-edge-glyph) { display: none; }
.sk-palette.compact .sk-palette-group { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 10px 0; }
.sk-palette.compact .sk-chip { padding: 0; margin: 0; width: 38px; height: 38px; justify-content: center; border-radius: 9px; }
.sk-palette.compact .sk-chip-glyph { width: 30px; height: 30px; font-size: 15px; }
.sk-palette.compact .sk-edge-row { justify-content: center; padding: 7px 0; width: 38px; }
.sk-palette:not(.compact) .sk-palette-group + .sk-palette-group { border-top: 1px solid var(--sk-border); margin-top: 2px; }

/* \u2014 Onglets : glisser-d\xE9poser pour r\xE9ordonner \u2014 */
.sk-tab.dragging { opacity: 0.5; }
.sk-tab.drop-before { box-shadow: inset 2px 0 0 var(--sk-accent); }
.sk-tab.drop-after { box-shadow: inset -2px 0 0 var(--sk-accent); }

/* \u2014 Coloration syntaxique \u2014 */
.sk-tok-key { color: var(--sk-accent); }
.sk-tok-str { color: var(--sk-logSuccess); }
.sk-tok-num { color: var(--sk-logInfo); }
.sk-tok-bool { color: var(--sk-logWarn); }
.sk-tok-kw { color: var(--sk-accent); font-weight: 600; }
.sk-tok-com { color: var(--sk-textMuted); font-style: italic; }
.sk-tok-punct { color: var(--sk-textMuted); }

  <script>
(function () {
  var S = window.Skhema;
  function mem(o) { o.id = o.id || ('m' + Math.random().toString(36).slice(2, 8)); return o; }

  var reg = new S.RegistryService()
    .registerSchema(S.classDiagramSchema)
    .registerSchema(S.erDiagramSchema)
    .registerSchema(S.useCaseDiagramSchema)
    .registerSchema(S.sequenceDiagramSchema);

  var project = S.Project.create('Démonstration Skhêma');

  // 1) Diagramme de classes (seed intégré : Animal / Chien / Collier).
  var d1 = S.Diagram.create('class-diagram', 'Domaine métier');
  S.classDiagramSchema.seed(d1, reg);
  project.insertDiagram(d1);

  // 2) Diagramme entité-association.
  var d2 = S.Diagram.create('er-diagram', 'Base de données');
  var user = reg.createNode('er-diagram', 'entity', { x: 140, y: 150 });
  user.setLabel('Utilisateur');
  user.setMembers([
    mem({ kind: 'attribute', visibility: 'public', name: 'id', type: 'uuid', isStatic: true }),
    mem({ kind: 'attribute', visibility: 'public', name: 'email', type: 'varchar(255)', isAbstract: true }),
    mem({ kind: 'attribute', visibility: 'public', name: 'nom', type: 'varchar(120)' })
  ]);
  var cmd = reg.createNode('er-diagram', 'entity', { x: 520, y: 150 });
  cmd.setLabel('Commande');
  cmd.setMembers([
    mem({ kind: 'attribute', visibility: 'public', name: 'id', type: 'uuid', isStatic: true }),
    mem({ kind: 'attribute', visibility: 'public', name: 'montant', type: 'decimal(10,3)', isAbstract: true }),
    mem({ kind: 'attribute', visibility: 'public', name: 'creee_le', type: 'timestamp' })
  ]);
  d2.insertNode(user);
  d2.insertNode(cmd);
  var rel = reg.createEdge('er-diagram', 'one-to-many', user.id, cmd.id);
  rel.setLabel('passe');
  rel.setSourceMultiplicity('1');
  rel.setTargetMultiplicity('*');
  d2.insertEdge(rel);
  project.insertDiagram(d2);

  // 3) Diagramme de cas d'usage.
  var d3 = S.Diagram.create('usecase-diagram', 'Cas d’usage');
  var client = reg.createNode('usecase-diagram', 'actor', { x: 120, y: 240 });
  client.setLabel('Client');
  var boutique = reg.createNode('usecase-diagram', 'system', { x: 340, y: 80 });
  boutique.setLabel('Boutique en ligne');
  var passer = reg.createNode('usecase-diagram', 'usecase', { x: 440, y: 180 });
  passer.setLabel('Passer commande');
  var payer = reg.createNode('usecase-diagram', 'usecase', { x: 440, y: 320 });
  payer.setLabel('Payer');
  d3.insertNode(boutique);
  d3.insertNode(client);
  d3.insertNode(passer);
  d3.insertNode(payer);
  d3.insertEdge(reg.createEdge('usecase-diagram', 'usecase-assoc', client.id, passer.id));
  var inc = reg.createEdge('usecase-diagram', 'include', passer.id, payer.id);
  inc.setLabel('«include»');
  d3.insertEdge(inc);
  project.insertDiagram(d3);

  // 4) Diagramme de séquence (seed intégré : Client → API → BaseDeDonnées).
  var d4 = S.Diagram.create('sequence-diagram', 'Séquence');
  S.sequenceDiagramSchema.seed(d4, reg);
  // Enveloppe INSERT + retour dans un fragment opt pour illustrer.
  var seqEdges = d4.edges();
  if (seqEdges.length >= 3) {
    var frag = S.Fragment.create({ kind: 'opt', label: 'panier non vide', edgeIds: [seqEdges[1].id, seqEdges[2].id] });
    d4.insertFragment(frag);
  }
  project.insertDiagram(d4);

  project.setActive(d1.id);

  var editor = S.createEditor(document.getElementById('app'), { project: project, theme: 'light', autosave: true });
  var badge = document.getElementById('version-badge');
  if (badge) badge.textContent = 'v' + S.SKHEMA_VERSION;
  window.__skhema = editor;
})();
</script>
</body>
