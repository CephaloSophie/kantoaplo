<style id="kanto-back-style">

  html body{padding-left:56px !important;box-sizing:border-box !important}
  html body *,html body *::before,html body *::after{box-sizing:border-box}

  .kanto-back-btn{position:fixed;top:12px;left:12px;z-index:2147483000;display:inline-flex;align-items:center;height:40px;width:40px;padding:0;border:1px solid rgba(201,150,58,.45);border-radius:999px;background:rgba(11,15,23,.86);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);color:#e6d6a8;font-family:'Cinzel',ui-serif,Georgia,serif;text-decoration:none;box-shadow:0 6px 20px -4px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.2);overflow:hidden;transition:width .32s cubic-bezier(.2,.7,.2,1),background .2s,border-color .2s;user-select:none}
  .kanto-back-btn::before{content:'';position:absolute;inset:-1px;border-radius:999px;padding:1px;background:conic-gradient(from 220deg,#C9963A,#2DD4A0,#8B5CF6,#C9963A);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;opacity:0;transition:opacity .25s;pointer-events:none}
