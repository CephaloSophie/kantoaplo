<script>
  /* Démos (applications monopages) : GitHub Pages ne connaît que leur index.html.
     On mémorise l'adresse demandée, la démo la restaure au démarrage. */
  (function () {
    var p = location.pathname, demos = ['/demos/pinax/', '/demos/mantis/'];
    for (var i = 0; i < demos.length; i++) {
      if (p.indexOf(demos[i]) === 0 && p !== demos[i]) {
        try { sessionStorage.setItem('demo-redirect', p + location.search + location.hash); } catch (e) {}
        location.replace(demos[i]);
        return;
      }
    }
  })();
</script>
